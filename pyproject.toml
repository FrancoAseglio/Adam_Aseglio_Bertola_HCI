[project]
name = "adam-aseglio-bertola"
version = "0.1.0"
description = ""
authors = [
    {name = "FrancoAseglio",email = "aseglio.f@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "regex (>=2025.11.3,<2026.0.0)",
    "geopandas (>=1.1.1,<2.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "plotly (>=6.5.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "adam_aseglio_bertola", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
